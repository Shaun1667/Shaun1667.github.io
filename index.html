<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Select · Portfolio</title>
  <meta name="description" content="Unity 게임 클라이언트 개발자 포트폴리오">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg"></div>

  <div class="launcher">
    <header class="topbar">
      <a class="player" href="#profile">
        <div class="avatar">P1</div>
        <div>
          <div class="player-name" id="playerName"></div>
          <div class="player-role" id="playerRole"></div>
        </div>
      </a>
      <nav class="filters" id="filters" aria-label="프로젝트 종류"></nav>
      <button class="pbtn" id="soundBtn" type="button" aria-pressed="false">SOUND OFF</button>
    </header>

    <main class="stage">
      <section class="screen" id="screen" aria-live="polite">
        <div class="screen-media" id="screenMedia"></div>
        <div class="badge" id="badge" hidden></div>
        <div class="screen-overlay">
          <div class="slot-no" id="slotNo"></div>
          <h1 class="game-title" id="gameTitle"></h1>
          <div class="game-genre" id="gameGenre"></div>
          <p class="game-summary" id="gameSummary"></p>
          <div class="tags" id="gameTags"></div>
          <a class="start" id="startBtn" href="#"><span class="blink">▶</span> PRESS START</a>
        </div>
      </section>
    </main>

    <section class="shelf-wrap" aria-label="게임 목록">
      <div class="shelf" id="shelf" role="listbox"></div>
    </section>

    <footer class="hint ui">
      <span><span class="key">◀</span><span class="key">▶</span>선택</span>
      <span><span class="key">ENTER</span>시작</span>
      <span><span class="key">P</span>프로필</span>
    </footer>
  </div>

  <section class="profile" id="profile">
    <div class="window">
      <div class="section-label">PLAYER PROFILE</div>
      <h2 id="profileName"></h2>
      <p id="profileIntro"></p>
      <div class="link-row" id="profileLinks"></div>
    </div>
    <div class="window">
      <div class="section-label">SKILLS</div>
      <div class="skills" id="skills"></div>
    </div>
  </section>

  <script src="data/games.js"></script>
  <script src="js/common.js"></script>
  <script src="js/launcher.js"></script>
</body>
</html>
